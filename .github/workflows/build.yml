name: Build APK Native

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Siapkan kunci penandatanganan
        run: keytool -genkeypair -keystore hola.jks -alias hola -keyalg RSA -keysize 2048 -validity 36500 -storepass hola1234 -keypass hola1234 -dname "CN=Hola"

      - name: Pasang ikon Hola (dari logo.zip di repo, jika ada)
        run: |
          mkdir -p app/src/main/res
          if [ -f "logo.zip" ]; then
            unzip -o logo.zip -d app/src/main/res/
            echo "Ikon dari logo.zip terpasang."
          else
            echo "logo.zip tidak ditemukan di root repo, pakai ikon bawaan Android."
          fi

      - name: Buat proyek
        run: |
          mkdir -p app/src/main/java/com/hola/app

          mkdir -p app/src/main/res/drawable

          cat > app/src/main/res/drawable/ic_lock.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:pathData="M6.5,10H17.5A2.5,2.5 0 0 1 20,12.5V18.5A2.5,2.5 0 0 1 17.5,21H6.5A2.5,2.5 0 0 1 4,18.5V12.5A2.5,2.5 0 0 1 6.5,10Z"
                  android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="1.8"
                  android:strokeLineCap="round" android:strokeLineJoin="round"/>
              <path android:pathData="M8,10V7A4,4 0 0 1 16,7V10"
                  android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="1.8"
                  android:strokeLineCap="round" android:strokeLineJoin="round"/>
              <path android:pathData="M12,14.3A1.2,1.2 0 1 0 12,16.7A1.2,1.2 0 1 0 12,14.3Z"
                  android:fillColor="#FFFFFF"/>
              <path android:pathData="M12,16.5V18.5"
                  android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="1.8"
                  android:strokeLineCap="round" android:strokeLineJoin="round"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_backspace.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:pathData="M21,5H8L2,12L8,19H21A1,1 0 0 0 22,18V6A1,1 0 0 0 21,5Z"
                  android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="1.8"
                  android:strokeLineCap="round" android:strokeLineJoin="round"/>
              <path android:pathData="M14,9L10,15M10,9L14,15"
                  android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="1.8"
                  android:strokeLineCap="round" android:strokeLineJoin="round"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_close.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:pathData="M18,6L6,18M6,6L18,18"
                  android:fillColor="#00000000" android:strokeColor="#FFFFFF" android:strokeWidth="1.8"
                  android:strokeLineCap="round" android:strokeLineJoin="round"/>
          </vector>
          EOF

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Hola"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.hola.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.hola.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              signingConfigs {
                  release {
                      storeFile rootProject.file('hola.jks')
                      storePassword 'hola1234'
                      keyAlias 'hola'
                      keyPassword 'hola1234'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          lint {
              checkReleaseBuilds false
              abortOnError false
          }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <application
                  android:label="Hola"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          if [ ! -f logo.zip ]; then
            sed -i '/android:icon=/d;/android:roundIcon=/d' app/src/main/AndroidManifest.xml
          fi

          cat > app/src/main/java/com/hola/app/MainActivity.kt << 'EOF'
          package com.hola.app

          import android.animation.ObjectAnimator
          import android.app.Activity
          import android.app.AlertDialog
          import android.app.Dialog
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.res.ColorStateList
          import android.content.pm.ActivityInfo
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Matrix
          import android.graphics.Typeface
          import android.graphics.drawable.ColorDrawable
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.LayerDrawable
          import android.graphics.drawable.RippleDrawable
          import android.media.ExifInterface
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.provider.MediaStore
          import android.util.LruCache
          import android.view.Gravity
          import android.view.HapticFeedbackConstants
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.BaseAdapter
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.GridView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.MediaController
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import android.widget.VideoView
          import java.io.File
          import java.security.MessageDigest
          import java.util.concurrent.Executors

          private const val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
          private const val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
          private const val PICK = 7
          private const val REQ_PERM = 8
          private const val MAX_SELECT = 10
          private const val PIN_LEN = 6

          class MainActivity : Activity() {
              private val bg = Color.parseColor("#0A0F0D")
              private val panel = Color.parseColor("#121A17")
              private val stroke = Color.parseColor("#1F2E28")
              private val txt = Color.parseColor("#E6F0EC")
              private val gold = Color.parseColor("#4ADE9A")
              private val red = Color.parseColor("#FF5C6D")
              private val muted = Color.parseColor("#5A7268")
              private val soft = Color.parseColor("#8FA89D")
              private val onAccent = Color.parseColor("#052217")

              private lateinit var prefs: SharedPreferences
              private lateinit var dir: File
              private lateinit var countTv: TextView
              private lateinit var statusTv: TextView
              private lateinit var emptyTv: TextView
              private lateinit var saveBtn: Button
              private lateinit var confirmBtn: Button
              private lateinit var cancelBtn: Button
              private lateinit var normalBar: LinearLayout
              private lateinit var selectBar: LinearLayout

              private val io = Executors.newFixedThreadPool(3)
              private val ui = Handler(Looper.getMainLooper())
              private val cache = LruCache<String, Bitmap>(120)
              private var files: List<File> = emptyList()
              private var buf = ""
              private var first: String? = null
              private var skipLock = false
              private var unlocked = false
              private var viewer: Dialog? = null
              private var selectMode = false
              private var selectVideo = true
              private fun kind() = if (selectVideo) "video" else "foto"
              private val selected = LinkedHashSet<File>()

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun isVideo(f: File) = f.name.endsWith(".vid")
              private fun status(t: String) { statusTv.text = t }
              private fun hash(p: String) = MessageDigest.getInstance("SHA-256")
                  .digest(("vault:" + p).toByteArray()).joinToString("") { "%02x".format(it) }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
                  window.statusBarColor = bg
                  window.navigationBarColor = bg
                  prefs = getSharedPreferences("vault", MODE_PRIVATE)
                  dir = File(filesDir, "vault").apply { mkdirs() }
                  showLock()
              }

              override fun onStop() {
                  super.onStop()
                  if (unlocked && !skipLock) showLock()
              }

              /* ---------- Layar PIN ---------- */

              private fun pill(t: String, bgc: Int, fg: Int, click: () -> Unit) = Button(this).apply {
                  text = t
                  isAllCaps = false
                  textSize = 13f
                  typeface = Typeface.DEFAULT_BOLD
                  setTextColor(fg)
                  background = GradientDrawable().apply { cornerRadius = dp(12).toFloat(); setColor(bgc); if (bgc == panel) setStroke(dp(1), stroke) }
                  stateListAnimator = null
                  minimumWidth = 0
                  minimumHeight = 0
                  setPadding(dp(14), dp(9), dp(14), dp(9))
                  layoutParams = LinearLayout.LayoutParams(0, WRAP, 1f).apply { setMargins(dp(4), 0, dp(4), 0) }
                  setOnClickListener { click() }
              }

              private fun glowBg(): LayerDrawable {
                  val glow = GradientDrawable().apply {
                      gradientType = GradientDrawable.RADIAL_GRADIENT
                      gradientRadius = resources.displayMetrics.widthPixels * 0.9f
                      setGradientCenter(0.5f, 0.4f)
                      colors = intArrayOf(Color.argb(28, 74, 222, 154), Color.TRANSPARENT)
                  }
                  return LayerDrawable(arrayOf(ColorDrawable(bg), glow))
              }

              private fun iconView(res: Int, sizeDp: Int, color: Int) = ImageView(this).apply {
                  setImageResource(res)
                  setColorFilter(color)
                  layoutParams = FrameLayout.LayoutParams(dp(sizeDp), dp(sizeDp), Gravity.CENTER)
              }

              private fun keyCell(label: String?, icon: Int, action: Boolean, click: () -> Unit): View {
                  val size = dp(72)
                  val mask = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(Color.WHITE) }
                  val cell = FrameLayout(this)
                  cell.layoutParams = LinearLayout.LayoutParams(size, size).apply { setMargins(dp(8), dp(8), dp(8), dp(8)) }
                  if (action) {
                      cell.background = RippleDrawable(ColorStateList.valueOf(Color.argb(45, 74, 222, 154)), null, mask)
                  } else {
                      val content = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(panel); setStroke(dp(1), stroke) }
                      cell.background = RippleDrawable(ColorStateList.valueOf(Color.argb(90, 74, 222, 154)), content, mask)
                  }
                  cell.isClickable = true
                  cell.setOnClickListener {
                      it.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                      click()
                  }
                  if (label != null) {
                      val tv = TextView(this)
                      tv.text = label
                      tv.textSize = 22f
                      tv.typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      tv.setTextColor(txt)
                      tv.gravity = Gravity.CENTER
                      cell.addView(tv, FrameLayout.LayoutParams(MATCH, MATCH))
                  } else {
                      cell.addView(iconView(icon, 24, muted))
                  }
                  return cell
              }

              private fun showLock() {
                  requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                  viewer?.dismiss()
                  viewer = null
                  unlocked = false
                  selectMode = false
                  selected.clear()
                  buf = ""
                  var busy = false

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                  }
                  val iconWrap = FrameLayout(this).apply {
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(Color.parseColor("#18241F"), Color.parseColor("#0F1714"))
                      ).apply { cornerRadius = dp(20).toFloat(); setStroke(dp(1), stroke) }
                  }
                  val lockIcon = iconView(R.drawable.ic_lock, 26, muted)
                  iconWrap.addView(lockIcon)
                  root.addView(iconWrap, LinearLayout.LayoutParams(dp(64), dp(64)).apply { gravity = Gravity.CENTER_HORIZONTAL })

                  val title = TextView(this).apply {
                      textSize = 15f
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      setTextColor(txt)
                      gravity = Gravity.CENTER
                  }
                  val sub = TextView(this).apply {
                      textSize = 12.5f
                      setTextColor(muted)
                      gravity = Gravity.CENTER
                  }
                  root.addView(title, LinearLayout.LayoutParams(WRAP, WRAP).apply { topMargin = dp(16); gravity = Gravity.CENTER_HORIZONTAL })
                  root.addView(sub, LinearLayout.LayoutParams(WRAP, WRAP).apply { topMargin = dp(8); gravity = Gravity.CENTER_HORIZONTAL })

                  val dotRow = LinearLayout(this).apply { gravity = Gravity.CENTER }
                  val dots = List(PIN_LEN) {
                      View(this).apply { layoutParams = LinearLayout.LayoutParams(dp(14), dp(14)).apply { setMargins(dp(9), 0, dp(9), 0) } }
                  }
                  dots.forEach { dotRow.addView(it) }
                  root.addView(dotRow, LinearLayout.LayoutParams(WRAP, WRAP).apply { topMargin = dp(40); gravity = Gravity.CENTER_HORIZONTAL })

                  fun prompt() {
                      when {
                          prefs.contains("pin") -> { title.text = "Masukkan PIN"; sub.text = "$PIN_LEN digit untuk membuka" }
                          first == null -> { title.text = "Buat PIN"; sub.text = "$PIN_LEN digit untuk mengunci" }
                          else -> { title.text = "Ulangi PIN"; sub.text = "Masukkan PIN yang sama" }
                      }
                  }
                  fun paintDots(error: Boolean = false) {
                      dots.forEachIndexed { i, v ->
                          val on = i < buf.length
                          val fillC = if (error) red else if (on) gold else Color.TRANSPARENT
                          val strokeC = if (error) red else if (on) gold else stroke
                          v.background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(fillC); setStroke(dp(1), strokeC) }
                          val sc = if (on || error) 1.15f else 1f
                          v.animate().scaleX(sc).scaleY(sc).setDuration(180).start()
                      }
                  }
                  fun wrong(message: String) {
                      paintDots(true)
                      lockIcon.setColorFilter(red)
                      sub.text = message
                      val d = dp(8).toFloat()
                      ObjectAnimator.ofFloat(iconWrap, "translationX", 0f, -d, d, -d, d, -d / 2, d / 2, 0f).setDuration(500).start()
                      ui.postDelayed({
                          buf = ""
                          busy = false
                          lockIcon.setColorFilter(muted)
                          paintDots()
                          prompt()
                      }, 600)
                  }
                  fun submit() {
                      if (buf.length != PIN_LEN) return
                      val h = hash(buf)
                      val saved = prefs.getString("pin", null)
                      if (saved != null) {
                          if (h == saved) { buf = ""; showVault() } else wrong("PIN salah, coba lagi")
                      } else if (first == null) {
                          first = h
                          buf = ""
                          busy = false
                          paintDots()
                          prompt()
                      } else if (first == h) {
                          prefs.edit().putString("pin", h).apply()
                          first = null
                          buf = ""
                          showVault()
                      } else {
                          first = null
                          wrong("PIN tidak sama, buat ulang")
                      }
                  }
                  fun press(d: String) {
                      if (busy || buf.length >= PIN_LEN) return
                      buf += d
                      paintDots()
                      if (buf.length == PIN_LEN) {
                          busy = true
                          ui.postDelayed({ submit() }, 180)
                      }
                  }
                  fun digit(d: String) = keyCell(d, 0, false) { press(d) }
                  fun row(vararg cells: View) = LinearLayout(this).apply {
                      gravity = Gravity.CENTER
                      cells.forEach { addView(it) }
                  }

                  val pad = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  pad.addView(row(digit("1"), digit("2"), digit("3")))
                  pad.addView(row(digit("4"), digit("5"), digit("6")))
                  pad.addView(row(digit("7"), digit("8"), digit("9")))
                  pad.addView(row(
                      keyCell(null, R.drawable.ic_backspace, true) { if (!busy) { buf = buf.dropLast(1); paintDots() } },
                      digit("0"),
                      keyCell(null, R.drawable.ic_close, true) { if (!busy) { buf = ""; paintDots() } }
                  ))
                  root.addView(pad, LinearLayout.LayoutParams(WRAP, WRAP).apply { topMargin = dp(32); gravity = Gravity.CENTER_HORIZONTAL })

                  paintDots()
                  prompt()
                  val sv = ScrollView(this).apply {
                      isFillViewport = true
                      isVerticalScrollBarEnabled = false
                      fitsSystemWindows = true
                      background = glowBg()
                      addView(root)
                  }
                  setContentView(sv)
              }


              /* ---------- Brankas ---------- */

              private inner class Cell(c: Context) : FrameLayout(c) {
                  val img = ImageView(c).apply { scaleType = ImageView.ScaleType.CENTER_CROP }
                  val badge = TextView(c).apply {
                      text = "Video"
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.argb(170, 0, 0, 0))
                      setPadding(dp(6), dp(1), dp(6), dp(1))
                  }
                  val check = TextView(c).apply {
                      textSize = 13f
                      gravity = Gravity.CENTER
                      setTextColor(onAccent)
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.argb(140, 0, 0, 0))
                          setStroke(dp(1), Color.WHITE)
                      }
                  }
                  val dim = View(c).apply { setBackgroundColor(Color.argb(0, 0, 0, 0)) }
                  init {
                      setBackgroundColor(panel)
                      addView(img, LayoutParams(MATCH, MATCH))
                      addView(dim, LayoutParams(MATCH, MATCH))
                      addView(badge, LayoutParams(WRAP, WRAP, Gravity.END or Gravity.BOTTOM).apply { setMargins(0, 0, dp(4), dp(4)) })
                      addView(check, LayoutParams(dp(22), dp(22), Gravity.END or Gravity.TOP).apply { setMargins(0, dp(4), dp(4), 0) })
                  }
                  override fun onMeasure(w: Int, h: Int) { super.onMeasure(w, w) }
              }

              private val gridAdapter = object : BaseAdapter() {
                  override fun getCount() = files.size
                  override fun getItem(i: Int): Any = files[i]
                  override fun getItemId(i: Int) = i.toLong()
                  override fun getView(i: Int, v: View?, p: ViewGroup): View {
                      val cell = (v as? Cell) ?: Cell(this@MainActivity)
                      val f = files[i]
                      cell.img.setImageBitmap(null)
                      cell.img.tag = f.name
                      cell.badge.visibility = if (isVideo(f)) View.VISIBLE else View.GONE
                      if (selectMode) {
                          val eligible = isVideo(f) == selectVideo
                          cell.dim.setBackgroundColor(Color.argb(if (eligible) 0 else 140, 0, 0, 0))
                          cell.check.visibility = if (eligible) View.VISIBLE else View.GONE
                          cell.check.text = if (selected.contains(f)) "✓" else ""
                          cell.check.background = GradientDrawable().apply {
                              shape = GradientDrawable.OVAL
                              setColor(if (selected.contains(f)) gold else Color.argb(140, 0, 0, 0))
                              setStroke(dp(1), Color.WHITE)
                          }
                      } else {
                          cell.dim.setBackgroundColor(Color.argb(0, 0, 0, 0))
                          cell.check.visibility = View.GONE
                      }
                      val c = cache.get(f.name)
                      if (c != null) {
                          cell.img.setImageBitmap(c)
                      } else {
                          io.execute {
                              val bm = thumb(f)
                              if (bm != null) {
                                  cache.put(f.name, bm)
                                  ui.post { if (cell.img.tag == f.name) cell.img.setImageBitmap(bm) }
                              }
                          }
                      }
                      return cell
                  }
              }

              private fun showVault() {
                  unlocked = true
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = glowBg()
                      fitsSystemWindows = true
                  }
                  val head = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(14), dp(10), dp(14), dp(8))
                  }
                  val titleRow = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                  val titles = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  titles.addView(TextView(this).apply {
                      text = "Hola"
                      textSize = 22f
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                      setTextColor(txt)
                  })
                  countTv = TextView(this).apply { textSize = 13f; setTextColor(soft) }
                  titles.addView(countTv)
                  titleRow.addView(titles, LinearLayout.LayoutParams(0, WRAP, 1f))
                  head.addView(titleRow)

                  normalBar = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(10) }
                  }
                  val row1 = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  val row2 = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(8) }
                  }
                  row1.addView(pill("Tambah", gold, onAccent) {
                      skipLock = true
                      val i = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "*/*"
                          putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("image/*", "video/*"))
                          putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                      }
                      startActivityForResult(i, PICK)
                  })
                  row1.addView(pill("Kunci", panel, txt) { showLock() })
                  saveBtn = pill("Simpan Video", panel, txt) { enterSelectMode(true) }
                  row2.addView(saveBtn)
                  row2.addView(pill("Simpan Foto", panel, txt) { enterSelectMode(false) })
                  normalBar.addView(row1)
                  normalBar.addView(row2)
                  head.addView(normalBar)

                  selectBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      visibility = View.GONE
                      layoutParams = LinearLayout.LayoutParams(MATCH, WRAP).apply { topMargin = dp(10) }
                  }
                  cancelBtn = pill("Batal", panel, txt) { exitSelectMode() }
                  confirmBtn = pill("Confirm (0)", gold, onAccent) { confirmSave() }
                  selectBar.addView(cancelBtn)
                  selectBar.addView(confirmBtn)
                  head.addView(selectBar)

                  statusTv = TextView(this).apply {
                      textSize = 13f
                      setTextColor(gold)
                      setPadding(dp(14), 0, dp(14), dp(6))
                  }
                  emptyTv = TextView(this).apply {
                      text = "Belum ada file. Ketuk Tambah untuk memilih foto atau video."
                      setTextColor(soft)
                      gravity = Gravity.CENTER
                      setPadding(dp(28), dp(48), dp(28), dp(48))
                  }
                  val grid = GridView(this).apply {
                      numColumns = 3
                      horizontalSpacing = dp(3)
                      verticalSpacing = dp(3)
                      setAdapter(gridAdapter)
                      setOnItemClickListener { _, _, i, _ -> onCellTap(files[i]) }
                  }
                  root.addView(head)
                  root.addView(statusTv)
                  root.addView(emptyTv)
                  root.addView(grid, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  setContentView(root)
                  reload()
              }

              private fun onCellTap(f: File) {
                  if (!selectMode) { open(f); return }
                  if (isVideo(f) != selectVideo) { status("Pilih " + kind() + " saja."); return }
                  if (selected.contains(f)) {
                      selected.remove(f)
                  } else {
                      if (selected.size >= MAX_SELECT) { status("Maksimal $MAX_SELECT ${kind()} sekaligus."); return }
                      selected.add(f)
                  }
                  confirmBtn.text = "Confirm (${selected.size})"
                  status("${selected.size} dari $MAX_SELECT ${kind()} dipilih")
                  gridAdapter.notifyDataSetChanged()
              }

              private fun enterSelectMode(video: Boolean) {
                  selectVideo = video
                  if (files.none { isVideo(it) == video }) { status("Belum ada " + kind() + " di brankas."); return }
                  selectMode = true
                  selected.clear()
                  normalBar.visibility = View.GONE
                  selectBar.visibility = View.VISIBLE
                  confirmBtn.text = "Confirm (0)"
                  status("Pilih ${kind()} yang mau disimpan ke galeri (maks $MAX_SELECT)")
                  gridAdapter.notifyDataSetChanged()
              }

              private fun exitSelectMode() {
                  selectMode = false
                  selected.clear()
                  normalBar.visibility = View.VISIBLE
                  selectBar.visibility = View.GONE
                  status("")
                  gridAdapter.notifyDataSetChanged()
              }

              private fun confirmSave() {
                  if (selected.isEmpty()) { status("Pilih dulu minimal 1 ${kind()}."); return }
                  if (Build.VERSION.SDK_INT < 29 &&
                      checkSelfPermission(android.Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(android.Manifest.permission.WRITE_EXTERNAL_STORAGE), REQ_PERM)
                      return
                  }
                  val toSave = selected.toList()
                  val k = kind()
                  status("Menyimpan 0 dari ${toSave.size} ke galeri...")
                  io.execute {
                      var ok = 0
                      for (f in toSave) {
                          if (exportToGallery(f)) ok++
                          val n = ok
                          ui.post { status("Menyimpan $n dari ${toSave.size} ke galeri...") }
                      }
                      ui.post {
                          status("$ok $k tersimpan ke galeri HP.")
                          exitSelectMode()
                      }
                  }
              }

              override fun onRequestPermissionsResult(code: Int, perms: Array<out String>, results: IntArray) {
                  super.onRequestPermissionsResult(code, perms, results)
                  if (code == REQ_PERM && results.isNotEmpty() && results[0] == PackageManager.PERMISSION_GRANTED) {
                      confirmSave()
                  } else if (code == REQ_PERM) {
                      status("Izin penyimpanan ditolak, tidak bisa simpan ke galeri.")
                  }
              }

              private fun exportToGallery(f: File): Boolean {
                  try {
                      val video = isVideo(f)
                      var mime = if (video) "video/mp4" else "image/jpeg"
                      if (!video) {
                          val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                          BitmapFactory.decodeFile(f.absolutePath, o)
                          o.outMimeType?.let { mime = it }
                      }
                      val ext = when (mime) {
                          "image/png" -> "png"
                          "image/webp" -> "webp"
                          "image/gif" -> "gif"
                          "image/heic", "image/heif" -> "heic"
                          else -> if (video) "mp4" else "jpg"
                      }
                      val name = "Hola_${System.currentTimeMillis()}.$ext"
                      val collection = if (video) MediaStore.Video.Media.EXTERNAL_CONTENT_URI else MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                      if (Build.VERSION.SDK_INT >= 29) {
                          val values = ContentValues().apply {
                              put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                              put(MediaStore.MediaColumns.MIME_TYPE, mime)
                              put(MediaStore.MediaColumns.RELATIVE_PATH, if (video) "Movies/Hola" else "Pictures/Hola")
                              put(MediaStore.MediaColumns.IS_PENDING, 1)
                          }
                          val uri = contentResolver.insert(collection, values) ?: return false
                          contentResolver.openOutputStream(uri)!!.use { o -> f.inputStream().use { it.copyTo(o) } }
                          values.clear()
                          values.put(MediaStore.MediaColumns.IS_PENDING, 0)
                          contentResolver.update(uri, values, null, null)
                      } else {
                          val base = Environment.getExternalStoragePublicDirectory(if (video) Environment.DIRECTORY_MOVIES else Environment.DIRECTORY_PICTURES)
                          val folder = File(base, "Hola")
                          folder.mkdirs()
                          val out = File(folder, name)
                          f.inputStream().use { inp -> out.outputStream().use { o -> inp.copyTo(o) } }
                          val values = ContentValues().apply {
                              put(MediaStore.MediaColumns.DATA, out.absolutePath)
                              put(MediaStore.MediaColumns.MIME_TYPE, mime)
                          }
                          contentResolver.insert(collection, values)
                      }
                      return true
                  } catch (e: Exception) {
                      return false
                  }
              }

              private fun reload() {
                  files = (dir.listFiles() ?: emptyArray()).sortedByDescending { it.name }
                  gridAdapter.notifyDataSetChanged()
                  countTv.text = if (files.isEmpty()) "" else "${files.size} file tersimpan"
                  emptyTv.visibility = if (files.isEmpty()) View.VISIBLE else View.GONE
              }

              /* ---------- Tambah file (disalin ke penyimpanan privat) ---------- */

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  skipLock = false
                  if (req != PICK || res != RESULT_OK || data == null || !unlocked) return
                  val uris = mutableListOf<Uri>()
                  data.clipData?.let { for (i in 0 until it.itemCount) uris.add(it.getItemAt(i).uri) }
                  data.data?.let { if (uris.isEmpty()) uris.add(it) }
                  val total = uris.size
                  status("Menyimpan 0 dari $total...")
                  io.execute {
                      var ok = 0
                      for (u in uris) {
                          val mime = contentResolver.getType(u) ?: ""
                          val ext = if (mime.startsWith("video")) ".vid" else ".img"
                          val out = File(dir, "${System.currentTimeMillis()}_${(1000..9999).random()}$ext")
                          try {
                              contentResolver.openInputStream(u)!!.use { inp -> out.outputStream().use { o -> inp.copyTo(o) } }
                              ok++
                          } catch (e: Exception) {
                              out.delete()
                          }
                          val n = ok
                          ui.post { status("Menyimpan $n dari $total...") }
                      }
                      ui.post {
                          status("$ok dari $total file tersimpan. Hapus file aslinya dari galeri agar benar-benar tersembunyi.")
                          reload()
                      }
                  }
              }

              /* ---------- Thumbnail & pembuka file ---------- */

              private fun decode(path: String, max: Int): Bitmap? {
                  val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(path, o)
                  var s = 1
                  while (o.outWidth / (s * 2) >= max && o.outHeight / (s * 2) >= max) s *= 2
                  val bm = BitmapFactory.decodeFile(path, BitmapFactory.Options().apply { inSampleSize = s }) ?: return null
                  return try {
                      val deg = when (ExifInterface(path).getAttributeInt(ExifInterface.TAG_ORIENTATION, 1)) {
                          6 -> 90f
                          3 -> 180f
                          8 -> 270f
                          else -> 0f
                      }
                      if (deg == 0f) bm else Bitmap.createBitmap(bm, 0, 0, bm.width, bm.height, Matrix().apply { postRotate(deg) }, true)
                  } catch (e: Exception) {
                      bm
                  }
              }

              private fun thumb(f: File): Bitmap? = try {
                  if (isVideo(f)) {
                      val r = MediaMetadataRetriever()
                      r.setDataSource(f.absolutePath)
                      val fr = r.getFrameAtTime(1000000, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                      r.release()
                      fr?.let { Bitmap.createScaledBitmap(it, 256, maxOf(1, 256 * it.height / it.width), true) }
                  } else decode(f.absolutePath, 256)
              } catch (e: Exception) {
                  null
              }

              private fun open(f: File) {
                  val d = Dialog(this, android.R.style.Theme_Black_NoTitleBar_Fullscreen)
                  d.window?.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
                  val root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }
                  if (isVideo(f)) {
                      val vv = VideoView(this)
                      vv.setVideoPath(f.absolutePath)
                      val mc = MediaController(this)
                      mc.setAnchorView(vv)
                      vv.setMediaController(mc)
                      vv.setOnPreparedListener { mp ->
                          mp.isLooping = false
                          mp.start()
                      }
                      root.addView(vv, FrameLayout.LayoutParams(MATCH, MATCH, Gravity.CENTER))
                  } else {
                      val iv = ImageView(this)
                      iv.scaleType = ImageView.ScaleType.FIT_CENTER
                      iv.setImageBitmap(decode(f.absolutePath, 2048))
                      root.addView(iv, FrameLayout.LayoutParams(MATCH, MATCH, Gravity.CENTER))
                  }
                  val bar = LinearLayout(this).apply {
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(14), dp(14), dp(14), dp(14))
                      setBackgroundColor(Color.argb(150, 0, 0, 0))
                      fitsSystemWindows = true
                  }
                  bar.addView(pill("Tutup", panel, txt) { d.dismiss() })
                  if (isVideo(f)) {
                      var land = false
                      val rot = pill("Landscape", panel, txt) { }
                      rot.setOnClickListener {
                          land = !land
                          requestedOrientation = if (land) ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE else ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                          rot.text = if (land) "Potret" else "Landscape"
                      }
                      bar.addView(rot)
                  }
                  bar.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
                  bar.addView(pill("Hapus", red, Color.WHITE) {
                      AlertDialog.Builder(this)
                          .setMessage("Hapus file ini dari brankas? Tidak bisa dikembalikan.")
                          .setPositiveButton("Hapus") { _, _ ->
                              f.delete()
                              cache.remove(f.name)
                              d.dismiss()
                              reload()
                          }
                          .setNegativeButton("Batal", null)
                          .show()
                  })
                  root.addView(bar, FrameLayout.LayoutParams(MATCH, WRAP, Gravity.TOP))
                  d.setContentView(root)
                  d.setOnDismissListener {
                      viewer = null
                      requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_PORTRAIT
                  }
                  viewer = d
                  d.show()
              }
          }
          EOF

      - name: Cek ikon
        run: |
          if [ ! -f logo.zip ]; then
            sed -i '/android:icon=/d;/android:roundIcon=/d' app/src/main/AndroidManifest.xml
          fi

      - name: Build APK release
        run: gradle assembleRelease --no-daemon

      - name: Beri nama APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Hola.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hola
          path: out/Hola.apk
