name: Build APK Native

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Buat proyek
        run: |
          mkdir -p app/src/main/java/com/brankas/foto

          cat > settings.gradle << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BrankasFoto"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.brankas.foto'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.brankas.foto'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Brankas Foto"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/brankas/foto/MainActivity.kt << 'EOF'
          package com.brankas.foto

          import android.app.Activity
          import android.app.AlertDialog
          import android.app.Dialog
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Matrix
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.ExifInterface
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.LruCache
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.BaseAdapter
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.GridView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.MediaController
          import android.widget.TextView
          import android.widget.VideoView
          import java.io.File
          import java.security.MessageDigest
          import java.util.concurrent.Executors

          private const val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
          private const val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
          private const val PICK = 7

          class MainActivity : Activity() {
              private val bg = Color.parseColor("#101A2B")
              private val panel = Color.parseColor("#182640")
              private val gold = Color.parseColor("#C9A24B")
              private val red = Color.parseColor("#E5675A")
              private val muted = Color.parseColor("#9AA9C4")

              private lateinit var prefs: SharedPreferences
              private lateinit var dir: File
              private lateinit var countTv: TextView
              private lateinit var statusTv: TextView
              private lateinit var emptyTv: TextView

              private val io = Executors.newFixedThreadPool(3)
              private val ui = Handler(Looper.getMainLooper())
              private val cache = LruCache<String, Bitmap>(120)
              private var files: List<File> = emptyList()
              private var buf = ""
              private var first: String? = null
              private var skipLock = false
              private var unlocked = false
              private var viewer: Dialog? = null

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()
              private fun isVideo(f: File) = f.name.endsWith(".vid")
              private fun status(t: String) { statusTv.text = t }
              private fun hash(p: String) = MessageDigest.getInstance("SHA-256")
                  .digest(("vault:" + p).toByteArray()).joinToString("") { "%02x".format(it) }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
                  window.statusBarColor = bg
                  window.navigationBarColor = bg
                  prefs = getSharedPreferences("vault", MODE_PRIVATE)
                  dir = File(filesDir, "vault").apply { mkdirs() }
                  showLock()
              }

              override fun onStop() {
                  super.onStop()
                  if (unlocked && !skipLock) showLock()
              }

              /* ---------- Layar PIN ---------- */

              private fun pill(t: String, bgc: Int, fg: Int, click: () -> Unit) = Button(this).apply {
                  text = t
                  isAllCaps = false
                  textSize = 14f
                  typeface = Typeface.DEFAULT_BOLD
                  setTextColor(fg)
                  background = GradientDrawable().apply { cornerRadius = dp(10).toFloat(); setColor(bgc) }
                  stateListAnimator = null
                  minimumWidth = 0
                  minimumHeight = 0
                  setPadding(dp(16), dp(10), dp(16), dp(10))
                  layoutParams = LinearLayout.LayoutParams(WRAP, WRAP).apply { leftMargin = dp(8) }
                  setOnClickListener { click() }
              }

              private fun keyBtn(t: String, click: () -> Unit) = Button(this).apply {
                  text = t
                  textSize = 24f
                  isAllCaps = false
                  setTextColor(Color.WHITE)
                  background = GradientDrawable().apply {
                      shape = GradientDrawable.OVAL
                      setColor(panel)
                      setStroke(dp(1), Color.parseColor("#2A3B5C"))
                  }
                  stateListAnimator = null
                  minimumWidth = 0
                  minimumHeight = 0
                  setPadding(0, 0, 0, 0)
                  layoutParams = LinearLayout.LayoutParams(dp(72), dp(72)).apply { setMargins(dp(8), dp(8), dp(8), dp(8)) }
                  setOnClickListener { click() }
              }

              private fun showLock() {
                  viewer?.dismiss()
                  viewer = null
                  unlocked = false
                  buf = ""
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(bg)
                  }
                  val title = TextView(this).apply {
                      text = "Brankas Foto"
                      textSize = 26f
                      typeface = Typeface.SERIF
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 0, dp(20))
                  }
                  val dots = TextView(this).apply {
                      textSize = 26f
                      setTextColor(gold)
                      gravity = Gravity.CENTER
                      letterSpacing = 0.3f
                  }
                  val msg = TextView(this).apply {
                      textSize = 14f
                      setTextColor(muted)
                      gravity = Gravity.CENTER
                      setPadding(0, dp(6), 0, dp(14))
                  }
                  fun prompt() {
                      msg.text = when {
                          prefs.contains("pin") -> "Masukkan PIN"
                          first == null -> "Buat PIN 4 angka"
                          else -> "Ulangi PIN untuk konfirmasi"
                      }
                  }
                  fun refresh() { dots.text = "●".repeat(buf.length) + "○".repeat(4 - buf.length) }
                  fun press(k: String) {
                      if (k == "⌫") buf = buf.dropLast(1) else if (buf.length < 4) buf += k
                      refresh()
                      if (buf.length < 4) return
                      val h = hash(buf)
                      buf = ""
                      refresh()
                      val saved = prefs.getString("pin", null)
                      if (saved != null) {
                          if (h == saved) showVault() else msg.text = "PIN salah, coba lagi"
                      } else if (first == null) {
                          first = h
                          prompt()
                      } else if (first == h) {
                          prefs.edit().putString("pin", h).apply()
                          first = null
                          showVault()
                      } else {
                          first = null
                          msg.text = "PIN tidak sama. Buat PIN baru"
                      }
                  }
                  root.addView(title)
                  root.addView(dots)
                  root.addView(msg)
                  val rows = listOf(listOf("1", "2", "3"), listOf("4", "5", "6"), listOf("7", "8", "9"), listOf("", "0", "⌫"))
                  for (row in rows) {
                      val r = LinearLayout(this)
                      for (k in row) {
                          if (k.isEmpty()) {
                              r.addView(View(this).apply {
                                  layoutParams = LinearLayout.LayoutParams(dp(72), dp(72)).apply { setMargins(dp(8), dp(8), dp(8), dp(8)) }
                              })
                          } else r.addView(keyBtn(k) { press(k) })
                      }
                      root.addView(r)
                  }
                  refresh()
                  prompt()
                  setContentView(root)
              }

              /* ---------- Brankas ---------- */

              private inner class Cell(c: Context) : FrameLayout(c) {
                  val img = ImageView(c).apply { scaleType = ImageView.ScaleType.CENTER_CROP }
                  val badge = TextView(c).apply {
                      text = "Video"
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.argb(170, 0, 0, 0))
                      setPadding(dp(6), dp(1), dp(6), dp(1))
                  }
                  init {
                      setBackgroundColor(panel)
                      addView(img, LayoutParams(MATCH, MATCH))
                      addView(badge, LayoutParams(WRAP, WRAP, Gravity.END or Gravity.BOTTOM).apply { setMargins(0, 0, dp(4), dp(4)) })
                  }
                  override fun onMeasure(w: Int, h: Int) { super.onMeasure(w, w) }
              }

              private val gridAdapter = object : BaseAdapter() {
                  override fun getCount() = files.size
                  override fun getItem(i: Int): Any = files[i]
                  override fun getItemId(i: Int) = i.toLong()
                  override fun getView(i: Int, v: View?, p: ViewGroup): View {
                      val cell = (v as? Cell) ?: Cell(this@MainActivity)
                      val f = files[i]
                      cell.img.setImageBitmap(null)
                      cell.img.tag = f.name
                      cell.badge.visibility = if (isVideo(f)) View.VISIBLE else View.GONE
                      val c = cache.get(f.name)
                      if (c != null) {
                          cell.img.setImageBitmap(c)
                      } else {
                          io.execute {
                              val bm = thumb(f)
                              if (bm != null) {
                                  cache.put(f.name, bm)
                                  ui.post { if (cell.img.tag == f.name) cell.img.setImageBitmap(bm) }
                              }
                          }
                      }
                      return cell
                  }
              }

              private fun showVault() {
                  unlocked = true
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(bg)
                  }
                  val head = LinearLayout(this).apply {
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(14), dp(10), dp(14), dp(10))
                  }
                  val titles = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  titles.addView(TextView(this).apply {
                      text = "Brankas"
                      textSize = 22f
                      typeface = Typeface.SERIF
                      setTextColor(Color.WHITE)
                  })
                  countTv = TextView(this).apply { textSize = 13f; setTextColor(muted) }
                  titles.addView(countTv)
                  head.addView(titles, LinearLayout.LayoutParams(0, WRAP, 1f))
                  head.addView(pill("Tambah", gold, Color.parseColor("#1B1608")) {
                      skipLock = true
                      val i = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "*/*"
                          putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("image/*", "video/*"))
                          putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                      }
                      startActivityForResult(i, PICK)
                  })
                  head.addView(pill("Kunci", panel, Color.WHITE) { showLock() })
                  statusTv = TextView(this).apply {
                      textSize = 13f
                      setTextColor(gold)
                      setPadding(dp(14), 0, dp(14), dp(6))
                  }
                  emptyTv = TextView(this).apply {
                      text = "Belum ada file. Ketuk Tambah untuk memilih foto atau video."
                      setTextColor(muted)
                      gravity = Gravity.CENTER
                      setPadding(dp(28), dp(48), dp(28), dp(48))
                  }
                  val grid = GridView(this).apply {
                      numColumns = 3
                      horizontalSpacing = dp(3)
                      verticalSpacing = dp(3)
                      setAdapter(gridAdapter)
                      setOnItemClickListener { _, _, i, _ -> open(files[i]) }
                  }
                  root.addView(head)
                  root.addView(statusTv)
                  root.addView(emptyTv)
                  root.addView(grid, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  setContentView(root)
                  reload()
              }

              private fun reload() {
                  files = (dir.listFiles() ?: emptyArray()).sortedByDescending { it.name }
                  gridAdapter.notifyDataSetChanged()
                  countTv.text = if (files.isEmpty()) "" else "${files.size} file tersimpan"
                  emptyTv.visibility = if (files.isEmpty()) View.VISIBLE else View.GONE
              }

              /* ---------- Tambah file (disalin ke penyimpanan privat) ---------- */

              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  skipLock = false
                  if (req != PICK || res != RESULT_OK || data == null || !unlocked) return
                  val uris = mutableListOf<Uri>()
                  data.clipData?.let { for (i in 0 until it.itemCount) uris.add(it.getItemAt(i).uri) }
                  data.data?.let { if (uris.isEmpty()) uris.add(it) }
                  val total = uris.size
                  status("Menyimpan 0 dari $total...")
                  io.execute {
                      var ok = 0
                      for (u in uris) {
                          val mime = contentResolver.getType(u) ?: ""
                          val ext = if (mime.startsWith("video")) ".vid" else ".img"
                          val out = File(dir, "${System.currentTimeMillis()}_${(1000..9999).random()}$ext")
                          try {
                              contentResolver.openInputStream(u)!!.use { inp -> out.outputStream().use { o -> inp.copyTo(o) } }
                              ok++
                          } catch (e: Exception) {
                              out.delete()
                          }
                          val n = ok
                          ui.post { status("Menyimpan $n dari $total...") }
                      }
                      ui.post {
                          status("$ok dari $total file tersimpan. Hapus file aslinya dari galeri agar benar-benar tersembunyi.")
                          reload()
                      }
                  }
              }

              /* ---------- Thumbnail & pembuka file ---------- */

              private fun decode(path: String, max: Int): Bitmap? {
                  val o = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeFile(path, o)
                  var s = 1
                  while (o.outWidth / (s * 2) >= max && o.outHeight / (s * 2) >= max) s *= 2
                  val bm = BitmapFactory.decodeFile(path, BitmapFactory.Options().apply { inSampleSize = s }) ?: return null
                  return try {
                      val deg = when (ExifInterface(path).getAttributeInt(ExifInterface.TAG_ORIENTATION, 1)) {
                          6 -> 90f
                          3 -> 180f
                          8 -> 270f
                          else -> 0f
                      }
                      if (deg == 0f) bm else Bitmap.createBitmap(bm, 0, 0, bm.width, bm.height, Matrix().apply { postRotate(deg) }, true)
                  } catch (e: Exception) {
                      bm
                  }
              }

              private fun thumb(f: File): Bitmap? = try {
                  if (isVideo(f)) {
                      val r = MediaMetadataRetriever()
                      r.setDataSource(f.absolutePath)
                      val fr = r.getFrameAtTime(1000000, MediaMetadataRetriever.OPTION_CLOSEST_SYNC)
                      r.release()
                      fr?.let { Bitmap.createScaledBitmap(it, 256, maxOf(1, 256 * it.height / it.width), true) }
                  } else decode(f.absolutePath, 256)
              } catch (e: Exception) {
                  null
              }

              private fun open(f: File) {
                  val d = Dialog(this, android.R.style.Theme_Black_NoTitleBar_Fullscreen)
                  d.window?.addFlags(WindowManager.LayoutParams.FLAG_SECURE)
                  val root = FrameLayout(this).apply { setBackgroundColor(Color.BLACK) }
                  if (isVideo(f)) {
                      val vv = VideoView(this)
                      vv.setVideoPath(f.absolutePath)
                      val mc = MediaController(this)
                      mc.setAnchorView(vv)
                      vv.setMediaController(mc)
                      vv.setOnPreparedListener { it.start() }
                      root.addView(vv, FrameLayout.LayoutParams(MATCH, MATCH))
                  } else {
                      val iv = ImageView(this)
                      iv.scaleType = ImageView.ScaleType.FIT_CENTER
                      iv.setImageBitmap(decode(f.absolutePath, 2048))
                      root.addView(iv, FrameLayout.LayoutParams(MATCH, MATCH))
                  }
                  val bar = LinearLayout(this).apply {
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(14), dp(14), dp(14), dp(14))
                      setBackgroundColor(Color.argb(150, 0, 0, 0))
                  }
                  bar.addView(pill("Tutup", panel, Color.WHITE) { d.dismiss() })
                  bar.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f))
                  bar.addView(pill("Hapus", red, Color.WHITE) {
                      AlertDialog.Builder(this)
                          .setMessage("Hapus file ini dari brankas? Tidak bisa dikembalikan.")
                          .setPositiveButton("Hapus") { _, _ ->
                              f.delete()
                              cache.remove(f.name)
                              d.dismiss()
                              reload()
                          }
                          .setNegativeButton("Batal", null)
                          .show()
                  })
                  root.addView(bar, FrameLayout.LayoutParams(MATCH, WRAP, Gravity.TOP))
                  d.setContentView(root)
                  d.setOnDismissListener { viewer = null }
                  viewer = d
                  d.show()
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: brankas-foto-native-apk
          path: app/build/outputs/apk/debug/app-debug.apk
